name: Provider E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  provider-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm
          sudo chmod 666 /dev/kvm

      - name: Run provider E2E with full log capture
        run: |
          set -o pipefail
          mkdir -p provider-cctv
          adb start-server || true
          ./gradlew :app:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.kakaanime.app.provider.OtakudesuProviderE2ETest#onePieceEpisodeSevenRendersFirstFrame,com.kakaanime.app.provider.SamehadakuEpisodeDiagnosticsTest#onePieceEpisodeSevenReportsServerHosts,com.kakaanime.app.provider.SamehadakuProviderE2ETest#onePieceEpisodeSevenRendersFirstFrame \
            --stacktrace 2>&1 | tee provider-cctv/gradle-e2e.log
          TEST_EXIT=${PIPESTATUS[0]}
          adb logcat -d -v threadtime > provider-cctv/logcat-full.txt || true
          grep -E 'STREAM_CCTV_|PROVIDER_CCTV_|E2E_PROVIDER=|Samehadaku|Otakudesu' provider-cctv/logcat-full.txt > provider-cctv/cctv-filtered.txt || true
          exit "$TEST_EXIT"

      - name: Upload full provider CCTV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-e2e-cctv
          path: provider-cctv/
          if-no-files-found: warn
          retention-days: 14
