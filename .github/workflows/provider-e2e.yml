name: Provider E2E

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  providers-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify KVM
        run: |
          test -e /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm

      - name: Run provider E2E diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 8
          ram-size: 8192M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: >-
            set +e;
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.kakaanime.app.provider.OtakudesuProviderE2ETest#onePieceEpisodeSevenRendersFirstFrame,com.kakaanime.app.provider.SamehadakuEpisodeDiagnosticsTest#onePieceEpisodeSevenReportsServerHosts,com.kakaanime.app.provider.SamehadakuProviderE2ETest#onePieceEpisodeSevenRendersFirstFrame
            --stacktrace;
            test_status=$?;
            adb logcat -d -v threadtime > provider-e2e-logcat.txt;
            grep -E 'STREAM_CCTV_|PROVIDER_CCTV|Otakudesu|Samehadaku' provider-e2e-logcat.txt > provider-e2e-cctv.txt || true;
            echo "Provider E2E exit status: $test_status";
            exit $test_status

      - name: Upload test reports and CCTV logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-e2e-reports
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/**
            provider-e2e-logcat.txt
            provider-e2e-cctv.txt
          if-no-files-found: ignore
