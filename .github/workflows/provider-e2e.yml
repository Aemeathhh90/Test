name: Provider E2E

on:
  workflow_dispatch:

jobs:
  provider-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run native provider batch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          emulator-boot-timeout: 1200000
          script: |
            set +e
            mkdir -p provider-cctv
            adb start-server
            adb logcat -c

            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.kakaanime.app.provider.ProviderBatchE2ETest#fourNativeProvidersRunToFirstFrameOrExactFailurePoint --stacktrace > provider-cctv/gradle-e2e.log 2>&1
            TEST_EXIT=$?
            cat provider-cctv/gradle-e2e.log

            adb logcat -d -v threadtime > provider-cctv/logcat-full.txt
            grep -E "KAKAANIME NATIVE PROVIDER BATCH|Samehadaku-native|Otakudesu-native|Anoboy-native-html|Kuronime-native-html|SEARCH_OK|DETAIL_OK|EPISODE_OK|STREAM_OK|FIRST_FRAME_OK|FAILED|ERROR" provider-cctv/logcat-full.txt > provider-cctv/batch-summary.txt || true
            {
              echo "TEST_EXIT=$TEST_EXIT"
              echo "--- NATIVE BATCH SUMMARY ---"
              cat provider-cctv/batch-summary.txt || true
            } > provider-cctv/cctv-summary.txt

            exit "$TEST_EXIT"

      - name: Upload native provider CCTV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-native-batch-cctv
          path: provider-cctv/
          if-no-files-found: warn
          retention-days: 14
