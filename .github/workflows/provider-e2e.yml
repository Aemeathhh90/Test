name: Provider E2E Playback

on:
  workflow_dispatch:
  push:
    branches:
      - provider-batch-2026-09-12
      - provider-e2e-dedicated-2026-09-12

jobs:
  kuronime-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Run Kuronime playback E2E on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: false
          pre-emulator-launch-script: sudo chmod 666 /dev/kvm || true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >-
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.kakaanime.app.provider.KuronimePlaybackE2eTest
            --stacktrace

  allanime-playback:
