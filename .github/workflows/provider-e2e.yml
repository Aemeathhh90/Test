name: Provider E2E Playback

on:
  workflow_dispatch:
    inputs:
      suite:
        description: E2E suite to run
        required: true
        type: choice
        default: all-providers
        options:
          - kuronime
          - allanime
          - samehadaku
          - all-providers

# Provider E2E is intentionally manual: Android emulator runs are the expensive gate.
# Run the smallest suite that proves the provider currently being changed.
concurrency:
  group: provider-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-playback-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Verify hosted runner
        run: |
          set -euxo pipefail
          echo "Runner: ${RUNNER_NAME}"
          echo "OS: ${RUNNER_OS}"
          uname -a
          java -version
          ./gradlew --version

      - name: Run selected provider playback E2E on one Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: false
          disable-animations: true
          pre-emulator-launch-script: sudo chmod 666 /dev/kvm || true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            run_test() {
              local test_class="$1"
              echo "=== Running ${test_class} ==="
              ./gradlew :app:connectedDebugAndroidTest \
                -Pandroid.testInstrumentationRunnerArguments.class="${test_class}" \
                --stacktrace
            }

            case "${{ inputs.suite }}" in
              kuronime)
                run_test com.kakaanime.app.provider.KuronimePlaybackE2eTest
                ;;
              allanime)
                run_test com.kakaanime.app.provider.AllAnimePlaybackE2eTest
                ;;
              samehadaku)
                run_test com.kakaanime.app.provider.SamehadakuPlaybackE2eTest
                ;;
              all-providers)
                run_test com.kakaanime.app.provider.KuronimePlaybackE2eTest
                run_test com.kakaanime.app.provider.AllAnimePlaybackE2eTest
                run_test com.kakaanime.app.provider.SamehadakuPlaybackE2eTest
                run_test com.kakaanime.app.provider.AllProvidersPlaybackE2eTest
                ;;
              *)
                echo "Unknown suite: ${{ inputs.suite }}"
                exit 2
                ;;
            esac

# Provider E2E gate: source changes must prove native playback through first rendered frame.
