name: Provider Source Fix Runner

on:
  push:
    branches:
      - provider-batch-2026-09-12

permissions:
  contents: write

jobs:
  normalize-otakudesu:
    if: ${{ !contains(github.event.head_commit.message, 'normalize Otakudesu search URLs') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Otakudesu URL-shaped endpoints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/kakaanime/app/provider/OtakudesuProvider.kt')
          s = p.read_text()
          s = s.replace('import java.net.URLEncoder\n', 'import java.net.URI\nimport java.net.URLEncoder\n')
          s = s.replace('val slug = animeId.removePrefix("$id:")', 'val slug = normalizeSlug(animeId.removePrefix("$id:"))')
          s = s.replace('val slug = item.optString("endpoint").trim().trim(\'/\')', 'val slug = normalizeSlug(item.optString("endpoint").trim())')
          marker = '''    private fun JSONObject.optDoubleOrNull(key: String): Double? =\n'''
          helper = '''    private fun normalizeSlug(value: String): String {\n        val raw = value.trim()\n        if (!raw.startsWith("http", ignoreCase = true)) return raw.trim('/')\n        return runCatching {\n            URI(raw).path.substringAfter("/anime/", "").trim('/').ifBlank { raw.substringAfterLast('/').trim('/') }\n        }.getOrDefault(raw.substringAfterLast('/').trim('/'))\n    }\n\n'''
          if 'private fun normalizeSlug(value: String)' not in s:
              s = s.replace(marker, helper + marker)
          p.write_text(s)
          PY
      - name: Commit patched provider
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/kakaanime/app/provider/OtakudesuProvider.kt
          git diff --cached --quiet && exit 0
          git commit -m 'fix(provider): normalize Otakudesu search URLs before detail lookup'
          git push
