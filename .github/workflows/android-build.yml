name: Android Build

on:
  push:
    branches:
      - codespace-didactic-computing-machine-g49vrx9jjjp4hww9v
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Patch player navigation
        if: github.event.head_commit.message != 'fix: disable nonexistent player episode navigation'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/kakaanime/app/player/VideoPlayerScreen.kt')
          s = p.read_text()
          old = '''val episodeNumbers = episodes.map { it.number }.filter { it > 0 }.distinct().sorted()\n    val previousEpisode = episodeNumbers.lastOrNull { it < episodeNumber } ?: (episodeNumber - 1).coerceAtLeast(1)\n    val nextEpisode = episodeNumbers.firstOrNull { it > episodeNumber } ?: (episodeNumber + 1)\n    val maxEpisode = episodeNumbers.maxOrNull() ?: episodeNumber'''
          new = '''val episodeNumbers = episodes.map { it.number }.filter { it > 0 }.distinct().sorted()\n    val previousProviderEpisode = episodeNumbers.lastOrNull { it < episodeNumber }\n    val nextProviderEpisode = episodeNumbers.firstOrNull { it > episodeNumber }\n    val previousEpisode = previousProviderEpisode\n    val nextEpisode = nextProviderEpisode\n    val maxEpisode = episodeNumbers.maxOrNull() ?: episodeNumber'''
          if old not in s:
              raise SystemExit('navigation declaration block not found; aborting')
          s = s.replace(old, new, 1)
          s = s.replace('previousEpisode = previousEpisode.toString()', 'previousEpisode = previousEpisode?.toString()')
          s = s.replace('nextEpisode = nextEpisode.toString()', 'nextEpisode = nextEpisode?.toString()')
          p.write_text(s)
          PY

      - name: Commit player navigation fix
        if: github.event.head_commit.message != 'fix: disable nonexistent player episode navigation'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/kakaanime/app/player/VideoPlayerScreen.kt
          git diff --cached --quiet && exit 0
          git commit -m 'fix: disable nonexistent player episode navigation'
          git push origin HEAD:main

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: KakaAnime-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
