name: Provider E2E - WarpBuild

on:
  workflow_dispatch:

jobs:
  provider-e2e:
    runs-on: warp-ubuntu-latest-x64-16x;nested-virtualization.enabled=true
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify KVM
        run: |
          ls -l /dev/kvm
          test -e /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run provider E2E with full CCTV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          emulator-boot-timeout: 1200000
          script: |
            # Keep this script POSIX-sh compatible. The runner invokes it via sh.
            set +e
            mkdir -p provider-cctv
            adb start-server
            adb logcat -c

            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.kakaanime.app.provider.OtakudesuProviderE2ETest#onePieceEpisodeSevenRendersFirstFrame,com.kakaanime.app.provider.SamehadakuEpisodeDiagnosticsTest#onePieceEpisodeSevenReportsServerHosts,com.kakaanime.app.provider.SamehadakuProviderE2ETest#onePieceEpisodeSevenRendersFirstFrame --stacktrace > provider-cctv/gradle-e2e.log 2>&1
            TEST_EXIT=$?
            cat provider-cctv/gradle-e2e.log

            adb logcat -d -v threadtime > provider-cctv/logcat-full.txt
            grep -E "STREAM_CCTV_|PROVIDER_CCTV_|E2E_PROVIDER=|Samehadaku|Otakudesu" provider-cctv/logcat-full.txt > provider-cctv/cctv-filtered.txt || true
            {
              echo "TEST_EXIT=$TEST_EXIT"
              echo "--- CCTV COUNTS ---"
              printf "STREAM_CCTV="; grep -c "STREAM_CCTV_" provider-cctv/logcat-full.txt || true
              printf "PROVIDER_CCTV="; grep -c "PROVIDER_CCTV_" provider-cctv/logcat-full.txt || true
              printf "E2E_PROVIDER="; grep -c "E2E_PROVIDER=" provider-cctv/logcat-full.txt || true
              echo "--- LAST CCTV LINES ---"
              grep -E "STREAM_CCTV_|PROVIDER_CCTV_|E2E_PROVIDER=" provider-cctv/logcat-full.txt | tail -n 200 || true
            } > provider-cctv/cctv-summary.txt

            exit "$TEST_EXIT"

      - name: Upload full provider CCTV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-e2e-cctv-warpbuild
          path: provider-cctv/
          if-no-files-found: warn
          retention-days: 14
