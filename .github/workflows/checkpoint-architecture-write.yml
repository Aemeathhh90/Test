name: checkpoint-architecture-write

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append reference architecture
        shell: bash
        run: |
          if grep -q 'EXTRACTOR / STREAM SOLVING REFERENCE STACK' MASTER_CHECKPOINT.md; then
            echo 'Already present.'
            exit 0
          fi
          echo '' | base64 -d >> MASTER_CHECKPOINT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MASTER_CHECKPOINT.md
          git commit -m 'docs: add extractor reference architecture'
          git push
