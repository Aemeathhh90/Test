name: Provider Finalizer

on:
  push:
    branches:
      - provider-batch-2026-09-12

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, 'normalize Otakudesu search URLs') && !contains(github.event.head_commit.message, 'cleanup duplicate provider imports') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize provider source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/kakaanime/app/provider/OtakudesuProvider.kt')
          s = p.read_text()
          lines = s.splitlines()
          seen = False
          out = []
          for line in lines:
              if line == 'import java.net.URI':
                  if seen:
                      continue
                  seen = True
              out.append(line)
          p.write_text('\n'.join(out) + '\n')
          PY
      - name: Commit final source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/kakaanime/app/provider/OtakudesuProvider.kt
          git diff --cached --quiet && exit 0
          git commit -m 'fix(provider): normalize Otakudesu search URLs before detail lookup; cleanup duplicate provider imports'
          git push
