name: Provider E2E WarpBuild

on:
  workflow_dispatch:

# WarpBuild cloud runner:
# avoids GitHub-hosted Actions minutes while keeping
# Android Emulator hardware acceleration through nested virtualization.
jobs:
  provider-playback-e2e:
    runs-on: warp-ubuntu-latest-x64-4x;nested-virtualization.enabled=true
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Enable KVM group permissions
        run: |
          set -euxo pipefail
          echo "KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"" \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify KVM
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          ls -l /dev/kvm
          grep -c -E 'vmx|svm' /proc/cpuinfo
          java -version
          ./gradlew --version

      - name: Run provider playback E2E on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >-
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.kakaanime.app.provider.KuronimePlaybackE2eTest
            --stacktrace
            &&
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.kakaanime.app.provider.AllAnimePlaybackE2eTest
            --stacktrace
            &&
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.kakaanime.app.provider.SamehadakuPlaybackE2eTest
            --stacktrace
            &&
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.kakaanime.app.provider.AllProvidersPlaybackE2eTest
            --stacktrace

# Green gate remains unchanged:
# provider green requires real Media3 playback through
# onRenderedFirstFrame() with no player error.
