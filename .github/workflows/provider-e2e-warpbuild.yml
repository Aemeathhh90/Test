name: Provider E2E WarpBuild

on:
  workflow_dispatch:

concurrency:
  group: provider-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  otakudesu-e2e:
    name: Otakudesu E2E playback
    runs-on: warp-ubuntu-latest-x64-4x;nested-virtualization.enabled=true
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Confirm KVM is writable
        run: |
          ls -l /dev/kvm
          test -w /dev/kvm

      - name: Cache AVD
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-34-google-apis-x86_64

      - name: Run Otakudesu instrumentation E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --tests com.kakaanime.app.provider.OtakudesuProviderE2ETest.onePieceEpisodeOneRendersFirstFrame --build-cache --max-workers=4
