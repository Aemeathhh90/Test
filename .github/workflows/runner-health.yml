name: Runner Health

on:
  workflow_dispatch:

# Diagnostic only. Do not spend Actions minutes on every provider source commit.
jobs:
  runner-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prove hosted runner execution
        shell: bash
        run: |
          set -euxo pipefail
          echo "GitHub hosted runner is executing steps."
          echo "Runner: ${RUNNER_NAME}"
          echo "OS: ${RUNNER_OS}"
          uname -a
          printf 'runner-health-ok\n'
