name: Provider Source Cleanup Runner

on:
  push:
    branches:
      - provider-batch-2026-09-12

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'cleanup duplicate provider imports') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/kakaanime/app/provider/OtakudesuProvider.kt')
          s = p.read_text()
          s = s.replace('import java.net.URI\nimport java.net.URI\n', 'import java.net.URI\n')
          p.write_text(s)
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/kakaanime/app/provider/OtakudesuProvider.kt
          git diff --cached --quiet && exit 0
          git commit -m 'fix(provider): cleanup duplicate provider imports'
          git push
