9. **Hikari — 8.4/10**
   - Android-native streaming.
   - Media3/player integration.
   - CloudStream compatibility concepts.
   - **Dipakai sebagai referensi Android/player integration.**

10. **Anime Nexus — 8.1/10**
    - Cache.
    - Stale-cache fallback.
    - Provider rotation/recovery.
    - **Dipakai sebagai referensi reliability layer setelah P0 stabil.**

### 🔵 Gabungan arsitektur yang ditargetkan AniLab

```text
                         ANI LAB
                            │
                    ┌───────▼────────┐
                    │ Provider Router │
                    └───────┬────────┘
                            │
          ┌─────────────────┼─────────────────┐
          ▼                 ▼                 ▼
      Otakudesu          ANIMEIN            Wibuku
          │                 │                 │
          └─────────────────┼─────────────────┘
                            ▼
                    Server Discovery
                            ▼
                   Extractor Registry
                            │
             ┌──────────────┼──────────────┐
             ▼              ▼              ▼
          Direct         Embed/Iframe   Host Extractor
             │              │              │
             └──────────────┼──────────────┘
                            ▼
                    Redirect Resolver
                            ▼
                     WebView / JS
                    (jika memang perlu)
                            ▼
                    HLS/DASH Validation
                            ▼
                     ProviderStream
                            ▼
                          Media3
                            ▼
                 onRenderedFirstFrame()
```

### 🔵 Extractor priority model

```text
Specific host extractor
        ↓
Specialized API/JS/WebView resolver
        ↓
Generic embed/page extractor
        ↓
Generic direct-media extractor
        ↓
FAIL — controlled error
```

- Extractor spesifik selalu mendapat kesempatan sebelum generic fallback.
- Generic extractor tidak boleh menutupi extractor host yang lebih tepat.
- Direct `.m3u8/.mpd/.mp4` tetap jalur tercepat.
- Embed/player URL masuk resolver.
- Redirect dan iframe memiliki cycle/depth protection.
- Semua extractor mengembalikan model internal `ProviderStream`.

### 🔵 Stream resolver responsibilities

Resolver bersama AniLab bertanggung jawab atas:

- direct media detection
- embed/iframe discovery
- HTTP redirect handling
- referer propagation
- request headers
- host-specific extraction
- WebView/JS fallback bila diperlukan
- HLS/DASH/direct media classification
- quality normalization
- timeout
- retry limit
- loop/cycle protection
- controlled resolver errors

Provider **tidak** boleh berubah menjadi resolver monolith.

### 🔵 Provider responsibilities

Provider hanya menangani:

```text
Search
 ↓
Anime Detail
 ↓
Episode Discovery
 ↓
Server / Embed Discovery
 ↓
Candidate URLs
```

Setelah candidate URL ditemukan, provider menyerahkannya ke `StreamResolver`/`ExtractorRegistry`.

### 🔵 Error model yang ditargetkan

Resolver tidak lagi hanya mengandalkan `emptyList()` sebagai informasi kegagalan. Target internal:

```text
NO_MATCH
NETWORK_ERROR
HTTP_ERROR
REDIRECT_ERROR
EMBED_BLOCKED
EXTRACTOR_ERROR
INVALID_STREAM
HLS_ERROR
DASH_ERROR
EXPIRED_STREAM
TIMEOUT
```

UI tetap menerima error yang sederhana; detail teknis hanya untuk logging/debugging internal.

### 🔵 Reliability layer — target setelah P0

Setelah provider E2E stabil, AniLab dapat menambahkan:

```text
Provider failure
      ↓
Retry with limit
      ↓
Alternate server
      ↓
Alternate provider
      ↓
Cache/stale cache jika valid
      ↓
Controlled failure
```

Tidak ada infinite retry atau looping antar provider.

### 🔵 HLS protected-stream layer — conditional

- Signed/tokenized HLS tidak dianggap masalah yang harus diselesaikan generic extractor.
- Jika provider nyata membutuhkan session/token/CDN handling, buat resolver khusus untuk provider/host tersebut.
- Jangan memasukkan proxy/rewrite/decrypt layer ke AniLab sebelum E2E menunjukkan kebutuhan nyata.

### 🔵 Non-negotiable reference rules

- Tidak copy CloudStream, OCE, yt-dlp, MaxStream, Anime SDK, atau project lain secara wholesale.
- Tidak menambah dependency hanya karena sebuah project menggunakannya.
- Ambil **arsitektur/prinsip yang terbukti berguna**, lalu implementasikan Kotlin-native sesuai AniLab.
- Referensi baru hanya boleh masuk baseline jika benar-benar meningkatkan reliability, maintainability, provider coverage, atau E2E success rate.
- Jika referensi terbukti jelek/tidak relevan untuk masalah AniLab, **tidak dimasukkan**.
- Provider tetap tersembunyi dari user.
- User tetap melihat `Anime → Episode → Play`.
- Final gate tetap `ProviderStream → Media3 → onRenderedFirstFrame()`.

### 🔵 Reference implementation status

- 🟢 `StreamExtractor` foundation tersedia.
- 🟢 `ExtractorRegistry` foundation tersedia.
- 🟢 `StreamResolver` foundation tersedia.
- 🟢 `GenericDirectExtractor` tersedia.
- 🟢 `GenericEmbedExtractor` tersedia.
- 🟢 Specific-first / generic-last registry ordering tersedia.
- 🟡 Host-specific extractors masih ditambahkan berdasarkan kegagalan E2E nyata.
- 🔴 Protected HLS/token resolver belum diperlukan/diimplementasikan.
- 🔴 Reliability cache/circuit-breaker layer belum menjadi P0.
- 🔴 Provider E2E masih menunggu green.

> **Penting:** referensi ini tidak mengubah status provider menjadi 🟢. Build E2E tetap menjadi satu-satunya bukti final playback.
EOF

