name: One-time checkpoint reference update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-checkpoint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append AniLab reference architecture
        shell: bash
        run: |
          set -euo pipefail
          marker="# 6C. 🔵 ANILAB REFERENCE STACK — EXTRACTOR / RESOLVER / PROVIDER"
          if grep -Fq "$marker" MASTER_CHECKPOINT.md; then
            echo "Reference section already exists; nothing to do."
            exit 0
          fi
          cat >> MASTER_CHECKPOINT.md <<'EOF'

---

# 6C. 🔵 ANILAB REFERENCE STACK — EXTRACTOR / RESOLVER / PROVIDER

**Status:** 🔵 **REFERENCE & ARCHITECTURE TERKUNCI — TIDAK DI-COPY WHOLESALE**

Referensi tambahan yang sudah disaring untuk AniLab. Tujuannya menyimpan **struktur dan prinsip yang layak diadopsi**, bukan menjadikan project lain sebagai dependency.

