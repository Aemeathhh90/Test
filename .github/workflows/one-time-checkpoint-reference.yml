4. **CloudStream — 9.5/10**
   - Provider → episode/server discovery → extractor → stream.
   - `loadExtractor()` style dispatcher.
   - Host-specific extractor registry.
   - Direct media + embed source handling.
   - **Dipakai sebagai blueprint provider/extractor separation.**

5. **Media Downloader — 9.5/10**
