   - Provider → episode → stream separation.
   - Generic HLS extractor.
   - Provider mapping/cross-source identity.
   - Retry, cancellation, concurrency control.
   - Live E2E provider validation.
   - **Dipakai sebagai referensi anime-provider + E2E architecture.**

3. **OCE — 9.6/10**
   - Extractor registry.
   - Fallback pipeline.
   - Config-driven provider/domain.
   - Cache.
   - Circuit breaker.
