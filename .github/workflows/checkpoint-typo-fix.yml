name: checkpoint-typo-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix checkpoint heading
        shell: bash
        run: |
          if ! grep -q 'REFERENSE STACK' MASTER_CHECKPOINT.md; then
            echo 'Already fixed.'
            exit 0
          fi
          sed -i 's/REFERENSE STACK/REFERENCE STACK/' MASTER_CHECKPOINT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MASTER_CHECKPOINT.md
          git commit -m 'docs: fix extractor reference heading'
          git push
