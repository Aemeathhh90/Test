name: Fix Player Navigation

on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: disable nonexistent player episode navigation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/kakaanime/app/player/VideoPlayerScreen.kt')
          s = p.read_text()
          old = '''    val episodeNumbers = episodes.map { it.number }.filter { it > 0 }.distinct().sorted()\n    val previousEpisode = episodeNumbers.lastOrNull { it < episodeNumber } ?: (episodeNumber - 1).coerceAtLeast(1)\n    val nextEpisode = episodeNumbers.firstOrNull { it > episodeNumber } ?: (episodeNumber + 1)\n    val maxEpisode = episodeNumbers.maxOrNull() ?: episodeNumber'''
          new = '''    val episodeNumbers = episodes.map { it.number }.filter { it > 0 }.distinct().sorted()\n    val previousEpisode = episodeNumbers.lastOrNull { it < episodeNumber }\n    val nextEpisode = episodeNumbers.firstOrNull { it > episodeNumber }\n    val maxEpisode = episodeNumbers.maxOrNull() ?: episodeNumber'''
          if old not in s:
              raise SystemExit('expected navigation block not found')
          s = s.replace(old, new, 1)
          s = s.replace('previousEpisode = previousEpisode.toString()', 'previousEpisode = previousEpisode?.toString()')
          s = s.replace('nextEpisode = nextEpisode.toString()', 'nextEpisode = nextEpisode?.toString()')
          old_rail = '''    previousEpisode: Int,\n    currentEpisode: Int,\n    nextEpisode: Int,'''
          new_rail = '''    previousEpisode: Int?,\n    currentEpisode: Int,\n    nextEpisode: Int?,'''
          if old_rail not in s:
              raise SystemExit('expected rail signature not found')
          s = s.replace(old_rail, new_rail, 1)
          s = s.replace('    val previous = episodes.firstOrNull { it.number == previousEpisode }\n    val next = episodes.firstOrNull { it.number == nextEpisode }', '    val previous = previousEpisode?.let { value -> episodes.firstOrNull { it.number == value } }\n    val next = nextEpisode?.let { value -> episodes.firstOrNull { it.number == value } }', 1)
          s = s.replace('previousEpisode, previousEpisode in watchedEpisodes, previousEpisode > 0, onPreviousEpisode', 'previousEpisode, previousEpisode?.let { it in watchedEpisodes } == true, previousEpisode != null, onPreviousEpisode', 1)
          s = s.replace('nextEpisode, nextEpisode in watchedEpisodes, true, onNextEpisode', 'nextEpisode, nextEpisode?.let { it in watchedEpisodes } == true, nextEpisode != null, onNextEpisode', 1)
          p.write_text(s)
          PY
          grep -nE 'previousEpisode = previousEpisode\.toString|nextEpisode = nextEpisode\.toString' app/src/main/java/com/kakaanime/app/player/VideoPlayerScreen.kt && exit 1 || true
          grep -nE 'val previousEpisode =|val nextEpisode =|previousEpisode = previousEpisode\?\.toString|nextEpisode = nextEpisode\?\.toString|previousEpisode: Int\?|nextEpisode: Int\?' app/src/main/java/com/kakaanime/app/player/VideoPlayerScreen.kt
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/kakaanime/app/player/VideoPlayerScreen.kt
          git diff --cached --quiet && exit 0
          git commit -m 'fix: disable nonexistent player episode navigation'
          git push origin HEAD:main
