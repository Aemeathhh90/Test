name: Apply grouped bug fixes

on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.event.head_commit.message == 'chore: run grouped bug fixes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch known compile blockers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'expected text not found: {path}: {old!r}')
              p.write_text(s.replace(old, new, 1))

          replace('app/src/main/java/com/kakaanime/app/WatchTogetherScreen.kt',
                  '            WatchRoomUi("KA-020", "Frieren E20", "Frieren", 20, "Mizu", 4, 6, listOf("Fantasy", "Drama")),\n        )\n\n    selectedRoom?.let',
                  '            WatchRoomUi("KA-020", "Frieren E20", "Frieren", 20, "Mizu", 4, 6, listOf("Fantasy", "Drama")),\n        )\n    }\n\n    selectedRoom?.let')

          for name in ['FriendsScreen.kt', 'NotificationsScreen.kt', 'SearchUsersScreen.kt', 'OtherUserProfileScreen.kt']:
              replace(f'app/src/main/java/com/kakaanime/app/{name}',
                      'PaddingValues(horizontal = 18.dp, bottom = 36.dp)',
                      'PaddingValues(start = 18.dp, end = 18.dp, bottom = 36.dp)')

          replace('app/src/main/java/com/kakaanime/app/LibraryTabsScreen.kt',
                  'topPadding = 8.dp', 'topPadding = 8')

          for name in ['ReDantotsuHomeScreen.kt', 'VideoPlayerScreen.kt']:
              p = Path(f'app/src/main/java/com/kakaanime/app/{name}') if name == 'ReDantotsuHomeScreen.kt' else Path(f'app/src/main/java/com/kakaanime/app/player/{name}')
              s = p.read_text()
              if 'import androidx.compose.ui.draw.clip\n' not in s:
                  marker = 'import androidx.compose.ui.graphics.Color\n'
                  if marker not in s:
                      raise SystemExit(f'import marker not found: {p}')
                  s = s.replace(marker, marker.replace('\n', '') + '\nimport androidx.compose.ui.draw.clip\n', 1)
                  p.write_text(s)

          p = Path('app/src/main/java/com/kakaanime/app/WatchRoomScreen.kt')
          s = p.read_text()
          if 'import androidx.compose.foundation.layout.weight\n' not in s:
              marker = 'import androidx.compose.foundation.layout.width\n'
              if marker in s:
                  s = s.replace(marker, marker + 'import androidx.compose.foundation.layout.weight\n', 1)
              else:
                  marker = 'import androidx.compose.foundation.layout.Column\n'
                  s = s.replace(marker, marker + 'import androidx.compose.foundation.layout.weight\n', 1)
              p.write_text(s)
          PY
      - name: Commit grouped fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/kakaanime/app app/src/main/java/com/kakaanime/app/player .github/workflows/fix-player-navigation.yml
          git commit -m 'fix: resolve grouped compile blockers'
          git push origin HEAD:main
