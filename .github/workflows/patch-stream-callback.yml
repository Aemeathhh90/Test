name: Temporary Stream Callback Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: startsWith(github.event.head_commit.message, 'chore: temporary stream callback patcher')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Patch callback ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/kakaanime/app/player/VideoPlayerScreen.kt')
          text = path.read_text()
          old = '''    val playerController = rememberPlayerController(context)\n    val playerState = rememberPlayerState(playerController)\n    val player = playerController.player\n\n    DisposableEffect(player, videoUrl, episodeNumber) {\n        val listener = object : Player.Listener {\n            override fun onRenderedFirstFrame() { onRenderedFirstFrame() }\n        }'''
          new = '''    val playerController = rememberPlayerController(context)\n    val playerState = rememberPlayerState(playerController)\n    val player = playerController.player\n    val currentOnRenderedFirstFrame by rememberUpdatedState(onRenderedFirstFrame)\n\n    DisposableEffect(player, videoUrl, episodeNumber) {\n        val listener = object : Player.Listener {\n            override fun onRenderedFirstFrame() { currentOnRenderedFirstFrame() }\n        }'''
          if old not in text:
              raise SystemExit('Expected VideoPlayerScreen callback block was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/kakaanime/app/player/VideoPlayerScreen.kt
          git commit -m "fix: keep latest first-frame callback" 
          rm .github/workflows/patch-stream-callback.yml
          git add .github/workflows/patch-stream-callback.yml
          git commit -m "chore: remove temporary stream callback patcher"
          git push
